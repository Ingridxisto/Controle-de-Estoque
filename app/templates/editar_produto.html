<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Produto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style_produto.css') }}">
</head>

<body>

<div class="page">

    <div class="topbar">

        <div>

            <span class="eyebrow">ESTOQUE</span>

            <h1>Editar Produto</h1>

            <p>Atualize as informações do produto.</p>

        </div>

        <a href="{{ url_for('estoque.ver_estoque') }}"
           class="btn-voltar">
            Voltar
        </a>

    </div>


    <div class="card">

        <div class="card-header">

            <div>

                <h2>Informações do produto</h2>

                <span class="card-description">
                    Altere os dados necessários e salve as modificações.
                </span>

            </div>

        </div>


        <div class="form-container">

            <form
                action="{{ url_for('produto.editar_produto_route', id=produto.id) }}"
                method="post"
            >

                <div class="form-group">

                    <label for="nomeForm">
                        Nome
                    </label>

                    <input
                        type="text"
                        name="nomeForm"
                        id="nomeForm"
                        value="{{ produto.nome }}"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="valorForm">
                            Valor
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="valorForm"
                            id="valorForm"
                            value="{{ produto.valor }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="quantidade_minimaForm">
                            Quantidade mínima
                        </label>

                        <input
                            type="number"
                            min="0"
                            name="quantidade_minimaForm"
                            id="quantidade_minimaForm"
                            value="{{ produto.quantidade_minima }}"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="descricaoForm">
                        Descrição
                    </label>

                    <textarea
                        name="descricaoForm"
                        id="descricaoForm"
                        required
                    >{{ produto.descricao }}</textarea>

                </div>


                <div class="form-actions">

                    <a
                        href="{{ url_for('estoque.ver_estoque') }}"
                        class="btn-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Atualizar Produto
                    </button>

                </div>

            </form>

        </div>

    </div>


    <footer>
        Sistema de Controle de Estoque
    </footer>

</div>

</body>
</html>
