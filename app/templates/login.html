<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Controle de Estoque</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style_login.css') }}">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-header">

                <span class="login-icon">
                    📦
                </span>

                <span class="eyebrow">
                    CONTROLE DE ESTOQUE
                </span>

                <h1>
                    Bem-vindo
                </h1>

                <p>
                    Entre com seus dados para acessar o sistema.
                </p>

            </div>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    <div class="flash-messages">

                        {% for category, message in messages %}

                            <div class="flash-message {{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <form action="{{ url_for('usuario.login') }}"
                  method="post">

                <div class="form-group">

                    <label for="nomeForm">
                        Nome
                    </label>

                    <input
                        type="text"
                        name="nomeForm"
                        id="nomeForm"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senhaForm">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="senhaForm"
                        id="senhaForm"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="perfil">
                        Perfil
                    </label>

                    <select
                        name="perfil"
                        id="perfil"
                        required
                    >

                        <option value="Administrador">
                            Administrador
                        </option>

                        <option value="Comum">
                            Comum
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn-login">

                    Entrar

                </button>

            </form>


            <div class="login-footer">

                <span>
                    Controle de Estoque © 2026
                </span>

            </div>

        </div>

    </div>

</body>

</html>
